<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Flat illustration of a weekly planner with highlighted due dates">
  <title>Weekly planner illustration</title>

  <!-- Background -->
  <rect width="800" height="450" fill="#eef2f7"/>

  <!-- Page shadow -->
  <rect x="152" y="52" width="440" height="366" rx="14" fill="#cdd8e3" opacity="0.5"/>
  <rect x="144" y="44" width="440" height="366" rx="14" fill="#ffffff"/>

  <!-- Header band -->
  <rect x="144" y="44" width="440" height="64" rx="14" fill="#1f5f8b"/>
  <rect x="144" y="86" width="440" height="22" fill="#1f5f8b"/>
  <rect x="176" y="68" width="150" height="16" rx="8" fill="#ffffff" opacity="0.85"/>

  <!-- Binder rings -->
  <rect x="196" y="30" width="12" height="30" rx="6" fill="#b9c8d6"/>
  <rect x="256" y="30" width="12" height="30" rx="6" fill="#b9c8d6"/>
  <rect x="316" y="30" width="12" height="30" rx="6" fill="#b9c8d6"/>
  <rect x="376" y="30" width="12" height="30" rx="6" fill="#b9c8d6"/>
  <rect x="436" y="30" width="12" height="30" rx="6" fill="#b9c8d6"/>
  <rect x="496" y="30" width="12" height="30" rx="6" fill="#b9c8d6"/>

  <!-- Day labels -->
  <g fill="#c2cedb">
    <rect x="176" y="128" width="24" height="8" rx="4"/>
    <rect x="234" y="128" width="24" height="8" rx="4"/>
    <rect x="292" y="128" width="24" height="8" rx="4"/>
    <rect x="350" y="128" width="24" height="8" rx="4"/>
    <rect x="408" y="128" width="24" height="8" rx="4"/>
    <rect x="466" y="128" width="24" height="8" rx="4"/>
    <rect x="524" y="128" width="24" height="8" rx="4"/>
  </g>

  <!-- Grid cells: row 1 -->
  <g fill="#f4f7fa">
    <rect x="172" y="148" width="50" height="48" rx="8"/>
    <rect x="230" y="148" width="50" height="48" rx="8"/>
    <rect x="288" y="148" width="50" height="48" rx="8"/>
    <rect x="346" y="148" width="50" height="48" rx="8"/>
    <rect x="404" y="148" width="50" height="48" rx="8"/>
    <rect x="462" y="148" width="50" height="48" rx="8"/>
    <rect x="520" y="148" width="50" height="48" rx="8"/>
  </g>

  <!-- Row 2 with two highlighted days -->
  <g fill="#f4f7fa">
    <rect x="172" y="204" width="50" height="48" rx="8"/>
    <rect x="230" y="204" width="50" height="48" rx="8"/>
    <rect x="288" y="204" width="50" height="48" rx="8"/>
    <rect x="346" y="204" width="50" height="48" rx="8"/>
    <rect x="404" y="204" width="50" height="48" rx="8"/>
    <rect x="462" y="204" width="50" height="48" rx="8"/>
  </g>
  <rect x="520" y="204" width="50" height="48" rx="8" fill="#d97706" opacity="0.2"/>
  <circle cx="545" cy="222" r="5" fill="#d97706"/>

  <!-- Row 3 with one completed day -->
  <g fill="#f4f7fa">
    <rect x="172" y="260" width="50" height="48" rx="8"/>
    <rect x="230" y="260" width="50" height="48" rx="8"/>
    <rect x="288" y="260" width="50" height="48" rx="8"/>
    <rect x="346" y="260" width="50" height="48" rx="8"/>
    <rect x="462" y="260" width="50" height="48" rx="8"/>
    <rect x="520" y="260" width="50" height="48" rx="8"/>
  </g>
  <rect x="404" y="260" width="50" height="48" rx="8" fill="#17724a" opacity="0.16"/>
  <path d="M419 284 l7 8 l13 -15" fill="none" stroke="#17724a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Row 4 -->
  <g fill="#f4f7fa">
    <rect x="172" y="316" width="50" height="48" rx="8"/>
    <rect x="230" y="316" width="50" height="48" rx="8"/>
    <rect x="288" y="316" width="50" height="48" rx="8"/>
    <rect x="346" y="316" width="50" height="48" rx="8"/>
    <rect x="404" y="316" width="50" height="48" rx="8"/>
    <rect x="462" y="316" width="50" height="48" rx="8"/>
    <rect x="520" y="316" width="50" height="48" rx="8"/>
  </g>

  <!-- Pen resting beside the page -->
  <g transform="translate(636 236) rotate(-32)">
    <rect x="0" y="0" width="18" height="132" rx="9" fill="#1f5f8b"/>
    <rect x="0" y="96" width="18" height="20" fill="#164a6d"/>
    <path d="M0 132 l9 20 l9 -20 z" fill="#d97706"/>
    <rect x="0" y="14" width="18" height="6" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Small cup -->
  <rect x="646" y="118" width="46" height="52" rx="10" fill="#1f5f8b" opacity="0.85"/>
  <path d="M692 130 q26 6 0 26" fill="none" stroke="#1f5f8b" stroke-width="7" opacity="0.85"/>
  <rect x="646" y="118" width="46" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
</svg>
