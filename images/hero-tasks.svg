<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Flat illustration of a task list window with completed and pending tasks">
  <title>Task list illustration</title>

  <!-- Background -->
  <rect width="800" height="450" fill="#e9f1f7"/>

  <!-- Window shadow -->
  <rect x="118" y="72" width="576" height="326" rx="16" fill="#c9d9e6" opacity="0.55"/>
  <rect x="110" y="64" width="576" height="326" rx="16" fill="#ffffff"/>

  <!-- Window title bar -->
  <rect x="110" y="64" width="576" height="46" rx="16" fill="#1f5f8b"/>
  <rect x="110" y="94" width="576" height="16" fill="#1f5f8b"/>
  <circle cx="138" cy="87" r="6" fill="#ffffff" opacity="0.75"/>
  <circle cx="160" cy="87" r="6" fill="#ffffff" opacity="0.55"/>
  <circle cx="182" cy="87" r="6" fill="#ffffff" opacity="0.35"/>
  <rect x="300" y="80" width="196" height="14" rx="7" fill="#ffffff" opacity="0.35"/>

  <!-- Row 1: completed -->
  <rect x="140" y="132" width="516" height="62" rx="10" fill="#f4f7fa"/>
  <rect x="158" y="150" width="26" height="26" rx="6" fill="#17724a"/>
  <path d="M164 163 l6 7 l11 -13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="202" y="152" width="220" height="10" rx="5" fill="#8fa6b8"/>
  <rect x="202" y="170" width="140" height="8" rx="4" fill="#c9d9e6"/>
  <rect x="556" y="151" width="76" height="24" rx="12" fill="#17724a" opacity="0.15"/>
  <rect x="570" y="159" width="48" height="8" rx="4" fill="#17724a"/>

  <!-- Row 2: due soon -->
  <rect x="140" y="206" width="516" height="62" rx="10" fill="#f4f7fa"/>
  <rect x="158" y="224" width="26" height="26" rx="6" fill="#ffffff" stroke="#d8e0e8" stroke-width="2"/>
  <rect x="202" y="226" width="256" height="10" rx="5" fill="#8fa6b8"/>
  <rect x="202" y="244" width="164" height="8" rx="4" fill="#c9d9e6"/>
  <rect x="556" y="225" width="76" height="24" rx="12" fill="#d97706" opacity="0.16"/>
  <rect x="570" y="233" width="48" height="8" rx="4" fill="#d97706"/>

  <!-- Row 3: upcoming -->
  <rect x="140" y="280" width="516" height="62" rx="10" fill="#f4f7fa"/>
  <rect x="158" y="298" width="26" height="26" rx="6" fill="#ffffff" stroke="#d8e0e8" stroke-width="2"/>
  <rect x="202" y="300" width="188" height="10" rx="5" fill="#8fa6b8"/>
  <rect x="202" y="318" width="120" height="8" rx="4" fill="#c9d9e6"/>
  <rect x="556" y="299" width="76" height="24" rx="12" fill="#1f5f8b" opacity="0.14"/>
  <rect x="570" y="307" width="48" height="8" rx="4" fill="#1f5f8b"/>

  <!-- Add button -->
  <rect x="140" y="354" width="120" height="22" rx="11" fill="#1f5f8b" opacity="0.9"/>
  <path d="M154 365 h12 M160 359 v12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <rect x="176" y="361" width="60" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
</svg>
